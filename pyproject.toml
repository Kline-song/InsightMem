[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightmem"
version = "0.1"
description = "InsightMem retrieval and AML-compatible memory API"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4,<5",
    "faiss-cpu>=1.8,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "openai>=1.40,<3",
    "python-dotenv>=1,<2",
    "sentence-transformers>=3,<6",
    "torch>=2.3,<3",
    "tqdm>=4.66,<5",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
insightmem = "insightmem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
