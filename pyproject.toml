[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightmem"
version = "0.2"
description = "Synchronous coding-session memory service"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "openai>=1.40,<3",
    "python-dotenv>=1,<2",
    "sentence-transformers>=3,<6",
    "torch>=2.3,<3",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
